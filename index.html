<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국가고시 CBT 문제은행</title>
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f6f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .cbt-container { background: #fff; width: 100%; max-width: 650px; border: 2px solid #333; border-radius: 8px; padding: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 15px; }
        .score-badge { background: #28a745; color: #fff; padding: 6px 14px; border-radius: 15px; font-weight: bold; font-size: 14px; }
        .progress-bar { width: 100%; background: #e9ecef; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: #28a745; width: 0%; transition: width 0.3s; }
        .question-text { font-size: 17px; font-weight: bold; margin-bottom: 15px; line-height: 1.5; white-space: pre-line; color: #222; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: #f8f9fa; border: 1px solid #ced4da; padding: 12px 15px; text-align: left; font-size: 15px; border-radius: 6px; cursor: pointer; line-height: 1.4; transition: background 0.2s; }
        .option-btn:hover { background: #e9ecef; }
        .feedback { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-weight: bold; line-height: 1.4; }
        .correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .wrong { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .next-btn { margin-top: 15px; width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; display: none; font-weight: bold; }
        .next-btn:hover { background: #004085; }
    </style>
</head>
<body>

<div class="cbt-container">
    <div class="header">
        <h2 style="margin:0; color:#0056b3; font-size: 20px;">CBT 문제풀이</h2>
        <div class="score-badge">목표: <span id="correct-count">0</span> / 20</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

    <div id="quiz-box">
        <div class="question-text" id="question-text">문제은행 txt 파일을 로딩 중입니다...</div>
        <div class="options" id="options-container"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="loadNextQuestion()">다음 문제</button>
    </div>

    <div id="result-box" style="display:none; text-align:center; padding:30px 0;">
        <h1 style="color:#28a745;">🎉 목표 달성!</h1>
        <p>20문제를 모두 올바르게 맞히셨습니다. 수고하셨습니다!</p>
        <button class="next-btn" style="display:inline-block; width:auto; padding: 10px 24px;" onclick="location.reload()">다시 풀기</button>
    </div>
</div>

<script>
let questionBank = [];
const TARGET_SCORE = 20;
let currentCorrectCount = 0;
let currentQuestion = null;

// 동그라미 숫자 매핑 테이블
const circleNumMap = { '①': 0, '②': 1, '③': 2, '④': 3, '⑤': 4 };

// 1. txt 파일 불러오기
fetch('questions.txt')
    .then(response => {
        if (!response.ok) throw new Error("questions.txt 파일을 찾을 수 없습니다.");
        return response.text();
    })
    .then(text => {
        parseTXT(text);
        if (questionBank.length === 0) {
            alert("문제를 파싱하지 못했습니다. txt 형식을 확인해주세요.");
            return;
        }
        loadNextQuestion();
    })
    .catch(err => {
        document.getElementById('question-text').innerText = "오류: " + err.message;
    });

// 2. 작성해주신 txt 양식에 맞춘 특화 파서(Parser)
function parseTXT(text) {
    // 역슬래시(\) 제거
    const cleanText = text.replace(/\\/g, '');
    
    // 문제 단위로 분리 (숫자. 문제패턴 기준)
    const rawBlocks = cleanText.split(/\n(?=\d+\.\s)/);

    rawBlocks.forEach(block => {
        const lines = block.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length < 3) return;

        let q = '';
        let options = [];
        let answer = -1;
        let exp = '';

        lines.forEach(line => {
            // 정답 라인 추출 [정답: ⑤] 또는 [정답: 5]
            if (line.includes('[정답')) {
                const match = line.match(/\[정답:\s*([①-⑤1-5])\]/);
                if (match) {
                    const ansStr = match[1];
                    if (circleNumMap[ansStr] !== undefined) {
                        answer = circleNumMap[ansStr];
                    } else {
                        answer = parseInt(ansStr) - 1;
                    }
                }
            } 
            // 보기 추출 (①, ② ... 로 시작하는 라인)
            else if (/^[①-⑤]/.test(line)) {
                options.push(line);
            } 
            // 해설 추출 [해설: ...] (있을 경우)
            else if (line.includes('[해설')) {
                exp = line.replace(/\[해설:\s*/, '').replace(/\]$/, '').trim();
            }
            // 문제 제목 (숫자. 으로 시작하는 문제 본문)
            else if (/^\d+\./.test(line)) {
                q = line;
            } else if (!q.includes('[')) {
                // 문제 설명이나 지문이 여러 줄일 경우 이어서 연결
                q += '\n' + line;
            }
        });

        // 정상적으로 문제, 보기, 정답이 파싱된 경우만 목록에 추가
        if (q && options.length >= 2 && answer >= 0) {
            questionBank.push({ q, options, answer, exp });
        }
    });
}

// 3. 무작위 문제 출제
function loadNextQuestion() {
    if (currentCorrectCount >= TARGET_SCORE) {
        document.getElementById('quiz-box').style.display = 'none';
        document.getElementById('result-box').style.display = 'block';
        return;
    }

    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';

    // 무작위 선택
    const randomIndex = Math.floor(Math.random() * questionBank.length);
    currentQuestion = questionBank[randomIndex];

    document.getElementById('question-text').innerText = currentQuestion.q;
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    currentQuestion.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx);
        container.appendChild(btn);
    });
}

// 4. 정답 확인
function checkAnswer(selectedIndex) {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.style.pointerEvents = 'none');

    const feedback = document.getElementById('feedback');
    feedback.style.display = 'block';

    const numSymbols = ['①', '②', '③', '④', '⑤'];

    if (selectedIndex === currentQuestion.answer) {
        currentCorrectCount++;
        feedback.className = 'feedback correct';
        feedback.innerText = `⭕ 정답입니다! ${currentQuestion.exp ? '\n' + currentQuestion.exp : ''}`;
        
        document.getElementById('correct-count').innerText = currentCorrectCount;
        document.getElementById('progress-fill').style.width = `${(currentCorrectCount / TARGET_SCORE) * 100}%`;
    } else {
        feedback.className = 'feedback wrong';
        const correctSymbol = numSymbols[currentQuestion.answer] || (currentQuestion.answer + 1) + '번';
        feedback.innerText = `❌ 오답입니다. (정답: ${correctSymbol}) ${currentQuestion.exp ? '\n해설: ' + currentQuestion.exp : ''}`;
    }

    document.getElementById('next-btn').style.display = 'block';
}
</script>

</body>
</html>
